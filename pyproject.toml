[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-tracker-telegram-bot"
version = "1.0.0"
description = "Telegram bot for persistent Ozon shipment tracking"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "aiosqlite>=0.20,<1",
    "playwright>=1.52,<2",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]
postgres = [
    "asyncpg>=0.29,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
